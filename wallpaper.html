<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>NOIR — Wallpaper Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');:root{color-scheme:dark;--bg:#090b10;--panel:#11141c;--card:#171b25;--text:#f5f4f1;--muted:#9299a8;--line:#252a35;--accent:#c9f36a;--pink:#f27d91;--shadow:#0009}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;transition:.25s}body.light{color-scheme:light;--bg:#f4f3ef;--panel:#fff;--card:#fff;--text:#171a20;--muted:#737987;--line:#e3e2dc;--shadow:#30364a22}button{font:inherit;color:inherit;border:0;cursor:pointer}header{height:78px;padding:0 max(22px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);z-index:5}.brand{font:700 22px 'Space Grotesk';letter-spacing:1.4px}.brand em{font-style:normal;color:var(--accent)}.head-actions{display:flex;gap:10px}.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}.wrap{max-width:1180px;margin:auto;padding:38px 22px 100px}.eyebrow{color:var(--accent);letter-spacing:2.4px;font-size:11px;font-weight:700}.hero{display:flex;justify-content:space-between;align-items:end;margin:5px 0 28px;gap:20px}.hero h1{font:600 clamp(32px,5vw,52px)/1.05 'Space Grotesk';letter-spacing:-2px;margin:11px 0}.hero p{color:var(--muted);margin:0;font-size:14px}.count{color:var(--muted);font-size:13px;white-space:nowrap}.filters{display:flex;gap:9px;margin-bottom:22px}.chip{padding:10px 16px;border-radius:50px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px}.chip.active{background:var(--accent);border-color:var(--accent);color:#13180b;font-weight:700}.grid{columns:4 220px;column-gap:16px}.tile{display:block;position:relative;margin:0 0 16px;break-inside:avoid;border-radius:15px;overflow:hidden;background:var(--card);cursor:pointer;box-shadow:0 8px 25px var(--shadow)}.tile img{width:100%;display:block;min-height:160px;max-height:440px;object-fit:cover;transition:transform .45s}.tile:hover img{transform:scale(1.04)}.tile-info{position:absolute;bottom:0;left:0;right:0;padding:35px 13px 12px;background:linear-gradient(transparent,#000b);display:flex;align-items:end;justify-content:space-between;color:white;font-size:13px}.tile-info small{display:block;color:#c4c8cc;margin-top:3px}.tile-like{background:#0007;border-radius:50%;height:34px;width:34px;font-size:17px}.empty{padding:60px 20px;text-align:center;color:var(--muted);background:var(--panel);border-radius:16px}.status{margin:0 0 17px;color:var(--muted);font-size:12px}.viewer{position:fixed;inset:0;background:#050609f5;z-index:20;display:none;flex-direction:column;padding:18px max(18px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}.viewer.open{display:flex}.viewtop{height:54px;display:flex;align-items:center;justify-content:space-between;color:#fff}.viewmeta{font-size:13px;color:#c5c6ca}.view-actions{display:flex;gap:10px}.viewer .icon-btn{background:#ffffff12;border-color:#ffffff20}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;touch-action:pan-y}.stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;background:#111a;border:1px solid #ffffff30;border-radius:50%;font-size:22px;color:#fff}.arrow.left{left:12px}.arrow.right{right:12px}.bottom{width:min(420px,100%);margin:18px auto 0;text-align:center}.download{background:var(--accent);color:#151a0e;font-weight:700;border-radius:50px;padding:14px 24px;width:100%;font-size:15px}.download:disabled{opacity:.65}.progress{height:4px;background:#ffffff26;border-radius:5px;margin:12px 0 5px;overflow:hidden}.progress span{height:100%;display:block;background:var(--accent);width:0;transition:width .1s;border-radius:5px}@keyframes progressMove{from{transform:translateX(0);width:20%}to{transform:translateX(350%);width:35%}}.progress-label{font-size:12px;color:#b5b7bd;min-height:18px}.settings{position:fixed;inset:0;background:#0008;z-index:30;display:none;justify-content:flex-end}.settings.open{display:flex}.sheet{background:var(--bg);border-left:1px solid var(--line);width:min(410px,100%);height:100%;padding:28px 24px;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.sheet h2{font:600 25px 'Space Grotesk';margin:0}.setting-label{font-size:11px;color:var(--muted);letter-spacing:1.6px;margin:25px 0 10px}.setting-row{background:var(--panel);border:1px solid var(--line);padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin:8px 0}.theme-options{display:flex;gap:8px}.theme-options button{padding:8px 12px;border-radius:30px;background:var(--card);border:1px solid var(--line);font-size:12px}.theme-options button.selected{background:var(--accent);color:#111}.liked-list .setting-row{justify-content:flex-start;gap:12px;cursor:pointer}.liked-list img{width:52px;height:60px;object-fit:cover;border-radius:8px}.liked-list b{font-size:13px}.liked-list small{display:block;color:var(--muted);margin-top:4px}.share{width:100%;border-radius:12px;padding:14px;background:var(--card);border:1px solid var(--line);text-align:left}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#222832;color:#fff;padding:11px 16px;border-radius:30px;z-index:50;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){header{height:66px}.wrap{padding:27px 15px 80px}.grid{columns:2 145px;column-gap:10px}.tile{margin-bottom:10px;border-radius:11px}.tile img{max-height:340px}.hero{align-items:start;flex-direction:column;gap:8px}.arrow{width:40px;height:40px}.viewer{padding-top:max(10px,env(safe-area-inset-top))}}
</style></head><body>
<header><div class="brand">NOIR<em> / WALLS</em></div><div class="head-actions"><button class="icon-btn" title="Liked wallpapers" onclick="showLiked()">♡</button><button class="icon-btn" title="Settings" onclick="openSettings()">☰</button></div></header>
<main class="wrap"><div class="hero"><div><div class="eyebrow">CURATED FOR YOUR SCREEN</div><h1>Find your next<br>wallpaper.</h1><p>အကြိုက်ဆုံးပုံတွေကို ရွေးပြီး သိမ်းထားပါ။</p></div><div class="count" id="count">Loading wallpapers…</div></div><div class="filters"><button class="chip active" id="allChip" onclick="setFilter('all')">Discover</button><button class="chip" id="likedChip" onclick="setFilter('liked')">♥ Liked</button></div><div id="status" class="status"></div><div class="grid" id="grid"></div></main>
<section class="viewer" id="viewer"><div class="viewtop"><button class="icon-btn" onclick="closeViewer()">×</button><div class="viewmeta" id="viewmeta"></div><div class="view-actions"><button class="icon-btn" id="viewLike" onclick="toggleCurrentLike()">♡</button><button class="icon-btn" onclick="shareCurrent()">↗</button></div></div><div class="stage" id="stage"><button class="arrow left" onclick="step(-1)">‹</button><img id="large" alt="Wallpaper"><button class="arrow right" onclick="step(1)">›</button></div><div class="bottom"><button class="download" id="download" onclick="downloadCurrent()">↓ &nbsp; Download wallpaper</button><div class="progress"><span id="progress"></span></div><div class="progress-label" id="progressLabel"></div></div></section>
<aside class="settings" id="settings" onclick="if(event.target===this)closeSettings()"><div class="sheet"><div class="sheet-head"><h2>Settings</h2><button class="icon-btn" onclick="closeSettings()">×</button></div><div class="setting-label">APPEARANCE</div><div class="setting-row"><span>Theme</span><div class="theme-options"><button id="darkBtn" onclick="setTheme('dark')">◐ Dark</button><button id="lightBtn" onclick="setTheme('light')">☼ Normal</button></div></div><div class="setting-label">YOUR COLLECTION · <span id="likedCount">0</span></div><div id="likedList" class="liked-list"></div><div class="setting-label">SHARE</div><button class="share" onclick="shareApp()">↗ &nbsp; Share this wallpaper gallery</button></div></aside><div class="toast" id="toast"></div>
<script>
const API='https://sheetdb.io/api/v1/1aoupi9qg6433';
const fallback=[['Quiet peaks','Nature','photo-1464822759023-fed622ff2c3b'],['After the rain','Nature','photo-1518837695005-2083093ee35b'],['Desert bloom','Minimal','photo-1509316785289-025f5b846b35'],['Blue hour','Architecture','photo-1519608487953-e999c86e7455'],['Soft shapes','Minimal','photo-1518005020951-eccb494ad742'],['The wild','Nature','photo-1470770841072-f978cf4d019e'],['Golden coast','Travel','photo-1500375592092-40eb2168fd21'],['Into the forest','Nature','photo-1448375240586-882707db888b'],['Still life','Minimal','photo-1494438639946-1ebd1d20bf85'],['Night lights','City','photo-1519608487953-e999c86e7455'],['Open road','Travel','photo-1500530855697-b586d89ba3ee'],['Cloud study','Nature','photo-1534088568595-a066f410bcda']].map(([title,category,id],i)=>({id:'demo-'+i,title,category,url:`https://images.unsplash.com/${id}?auto=format&fit=crop&w=1000&q=85`}));
let photos=[],filter='all',current=0,liked=new Set(JSON.parse(localStorage.getItem('noir-liked')||'[]'));const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(row,i){let entries=Object.entries(row||[]),find=keys=>{for(const[k,v]of entries)if(keys.some(x=>k.toLowerCase().includes(x))&&typeof v==='string'&&v.trim())return v.trim();return''};let url=(row.ml_photo||'').trim()||find(['image','photo','wallpaper','url','link','picture','img']);if(!url)return null;if(url.startsWith('//'))url='https:'+url;let downloadUrl=url;if(url.includes('dropbox.com/')){downloadUrl=url.replace(/[?&](raw|dl)=1/,'').replace(/[?&]$/,'');downloadUrl+=(downloadUrl.includes('?')?'&':'?')+'dl=1';url=url.replace(/[?&](raw|dl)=1/,'').replace(/[?&]$/,'');url+=(url.includes('?')?'&':'?')+'raw=1'}return{id:String(row.id||row.ID||url),title:find(['title','name','caption'])||`Wallpaper ${i+1}`,category:find(['category','type','tag'])||'Wallpaper',url,downloadUrl}}
async function init(){try{let r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('SheetDB returned '+r.status);let data=await r.json(),rows=Array.isArray(data)?data:(data.ml_photo||data.data||[]),parsed=rows.map(normalize).filter(Boolean);if(!parsed.length)throw Error('No image URL column found');photos=parsed;$('status').textContent='Connected to SheetDB · ml_photo'}catch(e){photos=fallback;$('status').textContent='SheetDB မချိတ်ဆက်နိုင်ပါ · demo ပုံများကို ပြထားသည် ('+e.message+')';console.info('SheetDB:',e.message)}render()}
function render(){let list=filter==='liked'?photos.filter(p=>liked.has(p.id)):photos;$('count').textContent=`${list.length} WALLPAPER${list.length===1?'':'S'}`;$('likedCount').textContent=liked.size;$('allChip').classList.toggle('active',filter==='all');$('likedChip').classList.toggle('active',filter==='liked');$('grid').innerHTML=list.length?list.map(p=>{let i=photos.indexOf(p);return`<article class="tile" onclick="openViewer(${i})"><img loading="lazy" src="${safe(p.url)}" alt="${safe(p.title)}"><div class="tile-info"><div>${safe(p.title)}<small>${safe(p.category)}</small></div><button class="tile-like" onclick="event.stopPropagation();toggleLikeAt(${i})">${liked.has(p.id)?'♥':'♡'}</button></div></article>`}).join(''):'<div class="empty">ဒီမှာပြစရာ wallpaper မရှိသေးပါ။ ပုံတစ်ပုံကို like ပေးကြည့်ပါ။</div>';renderLikedList()}
function setFilter(f){filter=f;render()}function toggleLikeAt(i){if(photos[i])toggleLike(photos[i].id)}function toggleLike(id){liked.has(id)?liked.delete(id):liked.add(id);localStorage.setItem('noir-liked',JSON.stringify([...liked]));render();if($('viewer').classList.contains('open'))syncViewer()}function renderLikedList(){$('likedList').innerHTML=photos.filter(p=>liked.has(p.id)).map(p=>`<div class="setting-row" onclick="openViewer(${photos.indexOf(p)});closeSettings()"><img src="${safe(p.url)}"><div><b>${safe(p.title)}</b><small>${safe(p.category)}</small></div></div>`).join('')||'<div class="empty">Like ပေးထားတဲ့ wallpaper မရှိသေးပါ။</div>'}
function openViewer(i){current=i;$('viewer').classList.add('open');document.body.style.overflow='hidden';syncViewer()}function closeViewer(){$('viewer').classList.remove('open');document.body.style.overflow=''}function step(n){current=(current+n+photos.length)%photos.length;syncViewer()}function syncViewer(){let p=photos[current];if(!p)return;$('large').src=p.url;$('large').alt=p.title;$('viewmeta').textContent=`${p.title} · ${current+1} / ${photos.length}`;$('viewLike').textContent=liked.has(p.id)?'♥':'♡';$('viewLike').style.color=liked.has(p.id)?'var(--pink)':'white';$('progress').style.width='0';$('progressLabel').textContent=''}function toggleCurrentLike(){if(photos[current])toggleLike(photos[current].id)}
let touchX=0;$('stage').addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});$('stage').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55)step(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('open'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
async function downloadCurrent(){let p=photos[current];if(!p)return;let btn=$("download"),label=$("progressLabel"),bar=$("progress");btn.disabled=true;btn.textContent="Downloading…";bar.style.animation="none";bar.style.width="0";try{if(location.protocol!=="http:"&&location.protocol!=="https:")throw Error("localhost server မဖွင့်ထားပါ");let endpoint="/download?url="+encodeURIComponent(p.downloadUrl||p.url),r=await fetch(endpoint);if(!r.ok)throw Error("Download server error "+r.status);let total=Number(r.headers.get("content-length"))||0,reader=r.body.getReader(),loaded=0,chunks=[];while(true){let{done,value}=await reader.read();if(done)break;chunks.push(value);loaded+=value.length;if(total){let pct=Math.min(99,Math.round(loaded/total*100));bar.style.width=pct+"%";label.textContent=pct+"% downloaded"}else label.textContent=(loaded/1048576).toFixed(1)+" MB downloaded"}let blob=new Blob(chunks,{type:r.headers.get("content-type")||"application/octet-stream"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(p.title||"wallpaper").replace(/[^a-z0-9-_ ]/gi,"").trim().replace(/\s+/g,"-")+".jpg";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);bar.style.width="100%";label.textContent="100% · ဖုန်းထဲသို့ သိမ်းပြီးပါပြီ";toast("Download ပြီးပါပြီ")}catch(e){label.textContent=e.message.includes("localhost")?"Termux ထဲမှာ wallpaper_server.py ကို အရင်ဖွင့်ပါ":"Download မအောင်မြင်ပါ · "+e.message;toast("Download မအောင်မြင်ပါ")}finally{btn.disabled=false;btn.innerHTML="↓ &nbsp; Download wallpaper"}}
async function shareCurrent(){let p=photos[current];if(!p)return;try{if(navigator.share)await navigator.share({title:p.title,text:'Wallpaper from NOIR / WALLS',url:p.url});else{await navigator.clipboard.writeText(p.url);toast('Image link copied')}}catch(e){}}async function shareApp(){try{if(navigator.share)await navigator.share({title:'NOIR / WALLS',text:'Wallpaper gallery',url:location.href});else{await navigator.clipboard.writeText(location.href);toast('Gallery link copied')}}catch(e){}}
function openSettings(){$('settings').classList.add('open');renderLikedList()}function closeSettings(){$('settings').classList.remove('open')}function showLiked(){setFilter('liked');window.scrollTo({top:0,behavior:'smooth'})}function setTheme(t){document.body.classList.toggle('light',t==='light');localStorage.setItem('noir-theme',t);$('darkBtn').classList.toggle('selected',t==='dark');$('lightBtn').classList.toggle('selected',t==='light')}function toast(msg){let el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}setTheme(localStorage.getItem('noir-theme')||'dark');init();
</script></body></html>
